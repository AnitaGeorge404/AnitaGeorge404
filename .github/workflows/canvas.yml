name: Canvas

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  paint:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'canvas')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: AnitaGeorge404/canvas@v1
